[project]
name = "erpnext_print_pack"
authors = [
    { name = "Taimoor", email = "taimoor986@gmail.com" }
]
description = "Reusable ERPNext / Frappe Jinja print formats (invoices, tax formats, reports)"
requires-python = ">=3.10"
readme = "README.md"
dynamic = ["version"]
dependencies = []

[tool.bench.frappe-dependencies]
frappe = ">=16.0.0,<17.0.0"

[project.optional-dependencies]
test = ["pytest>=7.0"]

[build-system]
requires = ["flit_core >=3.4,<4"]
build-backend = "flit_core.buildapi"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 110
target-version = "py310"
